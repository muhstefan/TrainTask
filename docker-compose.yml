services:
  postgres:
    image: postgres:17
    container_name: taskBd
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminsecret
      POSTGRES_DB: taskBd
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: