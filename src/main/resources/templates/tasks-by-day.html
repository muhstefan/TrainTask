<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задачи на день</title>
</head>
<body>
    <h1>Задачи на <span th:text="${date}">дата</span></h1>
    <a href="/page/tasks-by-date">Назад</a>
    
    <ul>
        <li th:each="task : ${tasks}">
            <strong th:text="${task.name}"></strong> - 
            <span th:text="${task.description}"></span>
            <form method="post" th:action="'/page/tasks/' + ${task.id} + '?returnDate=' + ${date}" style="display:inline;">
                <input type="hidden" name="_method" value="DELETE">
                <button type="submit">Удалить</button>
            </form>
        </li>
    </ul>
</body>
</html>
