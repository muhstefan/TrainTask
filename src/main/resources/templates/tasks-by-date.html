<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задачи по дням</title>
</head>
<body>
    <h1>Задачи по дням</h1>
    <a href="/page/">Назад</a>
    
    <div th:each="entry : ${tasksByDate}">
        <h2><a th:href="@{/page/tasks-by-date(date=${entry.key})}" th:text="${entry.key}">Дата</a></h2>
        <div th:replace="~{parts/task-list :: task-list(${entry.value}, null)}"></div>
    </div>

    <div th:replace="~{parts/task-list :: task-status-script}"></div>
</body>
</html>
